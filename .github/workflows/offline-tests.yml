name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup discovery and BAT regression tests (no installation or hardware)
        shell: powershell
        run: .\tests\test_setup_demo.ps1
      - name: Install using the packaged setup script
        shell: powershell
        run: .\Setup_Demo.ps1 -PythonPath (Get-Command python).Source
      - name: Run offline tests including hidden GUI widgets (no hardware)
        shell: powershell
        run: .\.venv\Scripts\python.exe -B -m unittest discover -s tests -v
